[project]
name = "scone_bench"
version = "0.1.0"
description = "Smart-contract vulnerability discovery benchmark for LLM agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "eth-utils>=2.0.0",
    "mcp[cli]>=1.3.0,<2.0.0",
    "pandas>=2.3.1,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "typer>=0.12.0,<1.0.0",
    "web3>=6.0.0,<8.0.0",
]

[project.optional-dependencies]
cache = ["aioboto3>=15.0.0,<16.0.0"]
dev = ["pytest>=7.0.0", "ruff==0.11.2"]

[project.scripts]
scone_bench = "scone_bench.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
