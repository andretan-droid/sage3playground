[project]
name = "scone_bench_runner"
version = "0.1.0"
description = "CLI runner that drives LLM APIs against the scone-bench MCP container"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.3.0",
    "openai>=1.109.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff==0.11.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "UP"]
ignore = ["E501"]
